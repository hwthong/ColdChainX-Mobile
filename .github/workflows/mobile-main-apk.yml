name: Mobile Main APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"

concurrency:
  group: mobile-main-apk
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    name: Validate and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Sync preview environment
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: >-
          npx --yes eas-cli@22.0.0 env:pull
          --environment preview
          --path .env.local
          --non-interactive

      - name: Generate Android project
        env:
          CI: "1"
        run: npx expo prebuild --platform android --clean

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Build release APK locally
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Prepare and verify APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_APK="android/app/build/outputs/apk/release/app-release.apk"
          FILE_NAME="coldchainx-main-${GITHUB_SHA::7}.apk"

          test -s "$SOURCE_APK"
          cp "$SOURCE_APK" "$FILE_NAME"

          APK_BYTES="$(wc -c < "$FILE_NAME")"
          if [ "$APK_BYTES" -lt 5242880 ]; then
            echo "Generated APK is unexpectedly small: $APK_BYTES bytes." >&2
            exit 1
          fi
          export APK_BYTES

          unzip -tqq "$FILE_NAME"

          node <<'NODE'
          const fs = require("fs");
          const appConfig = JSON.parse(fs.readFileSync("app.json", "utf8")).expo;
          const outputs = {
            file_name: `coldchainx-main-${process.env.GITHUB_SHA.slice(0, 7)}.apk`,
            apk_bytes: process.env.APK_BYTES,
            app_version: appConfig.version || "unknown",
            version_code: appConfig.android?.versionCode || "unknown",
          };

          for (const [key, value] of Object.entries(outputs)) {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${value}\n`);
          }
          NODE

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: coldchainx-main-${{ github.sha }}
          path: ${{ steps.apk.outputs.file_name }}
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        shell: bash
        run: |
          {
            echo "## ColdChainX Mobile APK"
            echo ""
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- App version: \`${{ steps.apk.outputs.app_version }}\`"
            echo "- Android versionCode: \`${{ steps.apk.outputs.version_code }}\`"
            echo "- File: \`${{ steps.apk.outputs.file_name }}\`"
            echo "- Size: \`${{ steps.apk.outputs.apk_bytes }} bytes\`"
            echo "- APK is available in the **Artifacts** section of this workflow run."
            echo "- Built locally on the GitHub runner; no EAS Build quota was used."
          } >> "$GITHUB_STEP_SUMMARY"
