name: Mobile Main APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"

concurrency:
  group: mobile-main-apk
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    name: Validate and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build APK with EAS
        id: eas-build
        shell: bash
        run: |
          set -euo pipefail

          eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --wait \
            --json > eas-build-result.json

      - name: Resolve build metadata
        id: build-meta
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require("fs");

          const raw = JSON.parse(
            fs.readFileSync("eas-build-result.json", "utf8")
          );
          const build = Array.isArray(raw) ? raw[0] : raw;

          if (!build) {
            throw new Error("EAS build result is empty.");
          }

          const apkUrl =
            build.artifacts?.applicationArchiveUrl ||
            build.artifacts?.buildUrl ||
            build.artifactUrl;
          const buildId = build.id;

          if (!buildId) {
            throw new Error("EAS build ID was not found.");
          }
          if (!apkUrl) {
            throw new Error("APK artifact URL was not found.");
          }

          const appConfig = JSON.parse(
            fs.readFileSync("app.json", "utf8")
          ).expo;
          const buildUrl =
            build.buildDetailsPageUrl ||
            `https://expo.dev/accounts/${appConfig.owner}/projects/${appConfig.slug}/builds/${buildId}`;
          const fileName = `coldchainx-main-${process.env.GITHUB_SHA.slice(0, 7)}.apk`;
          const outputs = {
            apk_url: apkUrl,
            build_url: buildUrl,
            build_id: buildId,
            file_name: fileName,
            app_version: build.appVersion || appConfig.version || "unknown",
            version_code:
              build.appBuildVersion ||
              appConfig.android?.versionCode ||
              "unknown",
            git_commit: build.gitCommitHash || process.env.GITHUB_SHA,
          };

          for (const [key, value] of Object.entries(outputs)) {
            const text = String(value);
            if (text.includes("\n") || text.includes("\r")) {
              throw new Error(`Invalid multiline output for ${key}.`);
            }
            fs.appendFileSync(
              process.env.GITHUB_OUTPUT,
              `${key}=${text}\n`
            );
          }
          NODE

      - name: Download and verify APK
        id: apk
        shell: bash
        env:
          APK_URL: ${{ steps.build-meta.outputs.apk_url }}
          FILE_NAME: ${{ steps.build-meta.outputs.file_name }}
        run: |
          set -euo pipefail

          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-all-errors \
            --silent \
            --show-error \
            "$APK_URL" \
            --output "$FILE_NAME"

          test -s "$FILE_NAME"

          APK_BYTES="$(wc -c < "$FILE_NAME")"
          if [ "$APK_BYTES" -lt 5242880 ]; then
            echo "Downloaded APK is unexpectedly small: $APK_BYTES bytes." >&2
            exit 1
          fi

          unzip -tqq "$FILE_NAME"
          echo "apk_bytes=$APK_BYTES" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: coldchainx-main-${{ github.sha }}
          path: ${{ steps.build-meta.outputs.file_name }}
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        shell: bash
        run: |
          {
            echo "## ColdChainX Mobile APK"
            echo ""
            echo "- Commit: \`${{ steps.build-meta.outputs.git_commit }}\`"
            echo "- EAS build ID: \`${{ steps.build-meta.outputs.build_id }}\`"
            echo "- App version: \`${{ steps.build-meta.outputs.app_version }}\`"
            echo "- Android versionCode: \`${{ steps.build-meta.outputs.version_code }}\`"
            echo "- File: \`${{ steps.build-meta.outputs.file_name }}\`"
            echo "- Size: \`${{ steps.apk.outputs.apk_bytes }} bytes\`"
            echo "- APK is available in the **Artifacts** section of this workflow run."
            echo "- EAS build: ${{ steps.build-meta.outputs.build_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
